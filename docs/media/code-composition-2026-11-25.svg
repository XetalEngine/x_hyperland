<text x="44" y="100" fill="#f1f6ff" font-size="40" font-weight="700">The code behind HyperFusion</text>
<text x="44" y="134" fill="#b2c2d7" font-size="19">Three layers. One desktop. Measured at release 0.0.0.324-alpha.</text>
