<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="724" viewBox="0 0 1280 724" role="img" aria-labelledby="title description">
<title id="title">HyperFusion source composition — as of November 25, 2026</title>
<desc id="description">Of 403,045 nonblank source lines including comments and tests, HyperFusion desktop and integrations comprise 214,638 lines (53.3 percent), Hyprland 160,985 (39.9 percent), and Compiz-related effects and switchers 27,422 (6.8 percent). This measures component size, not authorship or the entire operating system. Separate engines, vendor libraries, assets and binaries are excluded. The HyperFusion portion includes 59,202 lines in Control Panel, 36,533 in KVM management, and 26,917 in Fusion Files, transfer UI and archives.</desc>
<defs>
  <radialGradient id="background" cx="90%" cy="0%" r="100%">
    <stop offset="0" stop-color="#16354a"/>
    <stop offset=".65" stop-color="#0b1423"/>
    <stop offset="1" stop-color="#080f1b"/>
  </radialGradient>
</defs>
