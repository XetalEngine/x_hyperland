# Folder defaults and their desktop entry are private to this Hyprland session.
# Keep existing Flatpak and system application search paths.
env = XDG_CONFIG_DIRS,@HOME@/.config/hypr/desktop/config:/etc/xdg
env = XDG_DATA_DIRS,@HOME@/.config/hypr/desktop/data:@HOME@/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share:/usr/share
env = FONTCONFIG_FILE,@HYPR@/assets/fonts.conf
