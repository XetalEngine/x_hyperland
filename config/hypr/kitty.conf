# Used by Apps > Kitty, Super+Q and Super+Return in Hyprland.
# The shell keeps its own aliases and prompt; no KDE or shared Kitty settings load.
include theme/kitty-colors.conf
shell @HYPR@/scripts/terminal-shell.sh
window_padding_width 10

# Kitty's native cursor animation, including ordinary single-character movement.
cursor_shape block
shell_integration no-cursor
cursor_blink_interval 0.5 ease-in-out
cursor_trail 1
cursor_trail_decay 0.1 0.3
cursor_trail_start_threshold 1

# Visible, draggable history control for long command output.
scrollback_lines 10000
scrollbar always
scrollbar_interactive yes
scrollbar_jump_on_click yes
scrollbar_width 1.0
scrollbar_hover_width 1.4
scrollbar_handle_opacity 0.9
scrollbar_track_opacity 0.12
scrollbar_track_hover_opacity 0.25
scrollbar_min_handle_height 2
