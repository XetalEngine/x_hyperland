<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 360 360">
  <defs>
    <linearGradient id="armor" x1="0" y1="0" x2=".75" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="$bright"/><stop offset=".42" stop-color="$accent"/><stop offset="1" stop-color="$deep"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="$bright"/><stop offset="1" stop-color="$accent" stop-opacity=".08"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="$accent" stop-opacity=".2"/><stop offset="1" stop-color="$accent" stop-opacity="0"/>
    </radialGradient>
    <path id="arch" d="M180 35 C165 76 150 109 135 136 L165 155 L128 148 C104 195 76 244 43 293 C78 271 110 256 139 249 L145 221 C148 194 160 176 180 176 C200 176 212 194 215 221 L221 249 C251 256 283 272 317 293 L283 239 L244 223 L275 226 C234 157 207 104 180 35Z"/>
    <clipPath id="silhouette"><use href="#arch"/></clipPath>
  </defs>
  <circle cx="180" cy="177" r="164" fill="url(#halo)"/>
  <!-- Broken orbital rings and swept, mechanical wings. -->
  <g fill="none" stroke="$accent">
    <circle cx="180" cy="178" r="126" stroke-opacity=".16" stroke-width="1"/>
    <path d="M65 136 A125 125 0 0 1 142 59 M219 59 A125 125 0 0 1 300 146 M304 200 A125 125 0 0 1 270 266 M88 263 A125 125 0 0 1 58 208" stroke-opacity=".6" stroke-width="2"/>
    <path d="M57 177 H28 M303 177 H332 M180 30 V15 M180 295 V310" stroke-opacity=".48"/>
  </g>
  <g fill="url(#blade)" stroke="$accent" stroke-width=".7" stroke-opacity=".5">
    <path d="M116 159 L31 94 L73 174 L104 183Z" opacity=".55"/>
    <path d="M105 191 L22 152 L66 215 L91 214Z" opacity=".34"/>
    <path d="M245 159 L329 94 L287 174 L257 183Z" opacity=".55"/>
    <path d="M255 191 L338 152 L294 215 L269 214Z" opacity=".34"/>
  </g>
  <g fill="none" stroke="$accent" stroke-linejoin="round">
    <use href="#arch" stroke-width="13" stroke-opacity=".04"/>
    <use href="#arch" stroke-width="7" stroke-opacity=".1"/>
    <use href="#arch" stroke-width="3" stroke-opacity=".3"/>
  </g>
  <use href="#arch" fill="url(#armor)" stroke="$accent" stroke-width="1.5"/>
  <g clip-path="url(#silhouette)">
    <path d="M180 35 L180 176 L139 249 L43 293Z" fill="$bright" opacity=".16"/>
    <path d="M180 35 L212 167 L180 176Z" fill="$bright" opacity=".68"/>
    <path d="M180 176 L244 223 L317 293 L221 249Z" fill="$deep" opacity=".6"/>
    <path d="M126 164 L176 171 L93 262 L53 281Z" fill="url(#blade)" opacity=".75"/>
    <path d="M176 171 L145 221 M212 167 L244 223 M93 262 L139 249" fill="none" stroke="$bright" stroke-opacity=".6" stroke-width=".9"/>
    <path d="M146 113 L171 127 M141 123 L166 137" stroke="$bright" stroke-width="2" stroke-opacity=".6"/>
  </g>
  <path d="M180 35 C168 67 155 95 143 119 M122 162 L57 279 M223 250 L293 280" fill="none" stroke="$bright" stroke-width="1.7"/>
  <!-- Anime-style light flares, with no always-running animation process. -->
  <g fill="$bright">
    <path d="M272 68 L276 81 L289 85 L276 89 L272 102 L268 89 L255 85 L268 81Z"/>
    <path d="M71 230 L73 237 L80 239 L73 241 L71 248 L69 241 L62 239 L69 237Z" opacity=".85"/>
    <circle cx="109" cy="69" r="1.5"/><circle cx="303" cy="128" r="1.4"/>
    <circle cx="48" cy="190" r="1.3"/><circle cx="309" cy="237" r="1.5"/>
  </g>
  <path d="M143 281 L180 292 L217 281" fill="none" stroke="$accent" stroke-opacity=".55"/>
  <path d="M168 268 L180 249 L192 268 L180 275Z" fill="$accent" fill-opacity=".12" stroke="$accent" stroke-opacity=".7"/>
  <text x="180" y="330" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" letter-spacing="7" fill="$bright">ARCH</text>
  <path d="M78 321 H111 M249 321 H282" stroke="$accent" stroke-opacity=".55"/>
  <text x="180" y="348" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="7" letter-spacing="3" fill="$accent">HYPER FUSION</text>
</svg>
