# This workspace contains only the four startup consoles. Other windows keep their layout.
windowrule = match:class ^(xetal-startup-(info|matrix|clock|hero))$, float on, workspace special:xetal-startup silent, rounding 12, border_size 1, border_color rgba(72d8cebb) rgba(506c91aa), animation popin 78%
windowrule = match:class ^(xetal-startup-info)$, size ((monitor_w*0.32)-26) ((monitor_h-118)/3), move 22 60
windowrule = match:class ^(xetal-startup-matrix)$, size ((monitor_w*0.32)-26) ((monitor_h-118)/3), move 22 (76+(monitor_h-118)/3)
windowrule = match:class ^(xetal-startup-clock)$, size ((monitor_w*0.32)-26) ((monitor_h-118)/3), move 22 (92+2*((monitor_h-118)/3))
windowrule = match:class ^(xetal-startup-hero)$, size ((monitor_w*0.68)-38) (monitor_h-86), move ((monitor_w*0.32)+12) 60
