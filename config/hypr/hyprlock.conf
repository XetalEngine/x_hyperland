# Hollow Grove. Authentication and lock shortcuts are unchanged.
$font = Inter
general {
    hide_cursor = false
}
animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}
background {
    monitor =
    path = screenshot
    blur_passes = 3
}
input-field {
    monitor =
    size = 360, 58
    outline_thickness = 2
    inner_color = rgb(111915)
    outer_color = rgb(a3bc99)
    check_color = rgb(becdb3)
    fail_color = rgb(ea9bab)
    font_color = rgb(e8eae1)
    fade_on_empty = false
    rounding = 18
    font_family = $font
    placeholder_text = Password
    fail_text = $PAMFAIL$FPRINTFAIL
    dots_spacing = 0.3
    position = 0, -60
    halign = center
    valign = center
}
label {
    monitor =
    text = $TIME
    color = rgb(e8eae1)
    font_size = 80
    font_family = $font
    position = 0, 130
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(becdb3)
    font_size = 20
    font_family = $font
    position = 0, 55
    halign = center
    valign = center
}
label {
    monitor =
    text = $USER
    color = rgb(e8eae1)
    font_size = 16
    font_family = $font
    position = 0, -130
    halign = center
    valign = center
}
label {
    monitor =
    text = $LAYOUT[en,ru]
    color = rgb(becdb3)
    font_size = 14
    onclick = hyprctl switchxkblayout all next
    position = 0, -175
    halign = center
    valign = center
}
