# Managed by Hyprland Theme; only this compositor inherits these values.
env = QT_QPA_PLATFORMTHEME,xetal
env = QT_STYLE_OVERRIDE,Fusion
env = QT_PLUGIN_PATH,@HOME@/.config/hypr/theme/qt6:@HOME@/.config/hypr/theme/qt5
env = XETAL_THEME_CONFIG,@HOME@/.config/hypr/theme/state.json
env = GTK_THEME,Adwaita:dark
env = KDE_COLOR_SCHEME_PATH,@HOME@/.config/hypr/theme/current.colors
