# Managed by Hyprland Theme; only this compositor inherits these values.
env = XDG_CONFIG_DIRS,@HYPR@/desktop/config:/etc/xdg
env = XDG_DATA_DIRS,@HYPR@/desktop/data:/usr/local/share:/usr/share
env = QT_QPA_PLATFORMTHEME,xetal
env = QT_STYLE_OVERRIDE,Fusion
env = QT_PLUGIN_PATH,@HYPR@/theme/qt6:@HYPR@/theme/qt5
env = XETAL_THEME_CONFIG,@HYPR@/theme/state.json
env = GTK_THEME,Adwaita:dark
env = GTK3_MODULES,@HYPR@/theme/gtk3/libxetal-file-preview.so
env = KDE_COLOR_SCHEME_PATH,@HYPR@/theme/current.colors

# Hollow Grove: soft moonlit borders and quiet glass.
general:col.active_border = rgb(becdb3) rgb(a3bc99) 120deg
general:col.inactive_border = rgba(45594abb)
general:border_size = 1
general:gaps_in = 6
general:gaps_out = 10
decoration:rounding = 18
decoration:shadow:enabled = true
decoration:shadow:range = 24
decoration:shadow:render_power = 3
decoration:shadow:color = rgba(01050399)
decoration:blur:enabled = true
decoration:blur:size = 4
decoration:blur:passes = 2
decoration:blur:vibrancy = 0.05
