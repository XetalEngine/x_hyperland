name: Installer compatibility

on:
  push:
    paths: ['installer/**', 'tests/**', 'config/hypr/**', 'x_hyperinstall.sh', '.github/workflows/installer-compatibility.yml']
  pull_request:
    paths: ['installer/**', 'tests/**', 'config/hypr/**', 'x_hyperinstall.sh', '.github/workflows/installer-compatibility.yml']
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  user-folders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the standard-folder utility
        run: sudo apt-get update && sudo apt-get install -y xdg-user-dirs
      - name: Repair old accounts without replacing personal folder settings
        run: |
          python3 config/hypr/scripts/test_user_directories.py -v
          python3 -m unittest discover -s tests -p test_user_directory_updates.py -v
  arch-historical-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        prerequisites: [present, missing]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated historical test runner
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools bubblewrap
      - name: Install and recover from a one-year-old Arch base
        run: |
          if [ '${{ matrix.prerequisites }}' = missing ]; then
            sudo env XETAL_DISPOSABLE_ARCH_HISTORICAL=1 python3 tests/arch_historical_container.py --minimal
          else
            sudo env XETAL_DISPOSABLE_ARCH_HISTORICAL=1 python3 tests/arch_historical_container.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arch-historical-install-${{ matrix.prerequisites }}
          path: arch-historical-install.log
  arch-install:
    runs-on: ubuntu-latest
    container: archlinux:base
    strategy:
      fail-fast: false
      matrix:
        runtime: [fresh, existing]
    steps:
      - name: Prepare disposable Arch container
        run: pacman -Syu --noconfirm python sudo git
      - uses: actions/checkout@v4
      - name: Arch runtime and recovery regressions
        run: |
          python -m unittest discover -s tests -p test_arch_runtime.py -v
          python -m unittest discover -s tests -p test_runtime_setup.py -v
          python -m unittest discover -s tests -p test_distribution_support.py -v
          python -m unittest discover -s tests -p test_root_auth.py -v
      - name: Authenticate without preinstalled sudo
        env:
          XETAL_DISPOSABLE_ARCH: '1'
        run: python tests/root_auth_container.py
      - name: Install all dependencies, build native effects and verify recovery
        env:
          XETAL_DISPOSABLE_ARCH: '1'
        run: |
          if [ '${{ matrix.runtime }}' = existing ]; then
            python tests/arch_container.py --existing-runtime > arch-install.log 2>&1
          else
            python tests/arch_container.py > arch-install.log 2>&1
          fi
      - name: Resolve upgrades from older Arch installations
        run: python tests/repository_matrix.py --distro arch --historical 2025/11/05 --historical 2026/05/05 --output arch-history.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arch-install-and-history-${{ matrix.runtime }}
          path: |
            arch-install.log
            arch-history.json
  debian:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: Prepare disposable Debian container
        run: apt-get update && apt-get install -y --no-install-recommends python3 sudo util-linux passwd git ca-certificates
      - uses: actions/checkout@v4
      - name: Debian runtime and administrator regressions
        run: |
          python3 -m unittest discover -s tests -p 'test_debian*.py' -v
          python3 -m unittest discover -s tests -p test_administrator.py -v
          python3 -m unittest discover -s tests -p test_runtime_probe.py -v
          python3 -m unittest discover -s tests -p test_desktop_command_paths.py -v
          python3 -m unittest discover -s tests -p test_login_setup.py -v
          python3 -m unittest discover -s config/hypr/login -p test_login.py -v
          PYTHONPATH=tests python3 -m unittest test_installer.DependencyEnvironmentTests -v
      - name: Repair a DVD-only Debian source list and resolve dependencies
        env:
          XETAL_DISPOSABLE_DEBIAN: '1'
        run: python3 tests/debian_sources_container.py > debian-sources.log 2>&1
      - name: Debian administrator account setup
        env:
          XETAL_DISPOSABLE_DEBIAN: '1'
        run: |
          python3 tests/debian_administrator_container.py
          python3 tests/debian_root_auth_container.py
      - name: Install native runtime, build desktop and exercise recovery
        env:
          XETAL_DISPOSABLE_DEBIAN: '1'
        run: python3 tests/debian_container.py > debian-build.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debian-13-build
          path: |
            debian-build.log
            debian-sources.log
  fedora:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Prepare disposable Fedora container
        run: dnf -y install python3 sudo util-linux shadow-utils git
      - uses: actions/checkout@v4
      - name: Fedora runtime regressions
        run: python3 -m unittest discover -s tests -p test_fedora_runtime.py -v
      - name: Install signed runtime, build desktop and exercise recovery
        env:
          XETAL_DISPOSABLE_FEDORA: '1'
        run: python3 tests/fedora_container.py > fedora-build.log 2>&1
      - name: Qt vendor header warning regressions
        run: python3 -m unittest discover -s tests -p test_theme_build.py -v
      - name: KVM bridge recovery regressions
        run: python3 -m unittest discover -s config/hypr/kvm -p test_network_bridge.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fedora-44-build
          path: fedora-build.log
  repositories:
    runs-on: ubuntu-latest
    container: archlinux:base
    strategy:
      fail-fast: false
      matrix:
        distro: [arch, cachyos-v3, cachyos-v4, endeavouros, manjaro]
    steps:
      - name: Prepare disposable CI container
        run: pacman -Syu --noconfirm python git
      - uses: actions/checkout@v4
      - name: Distribution preflight regressions
        run: python -m unittest discover -s tests -p test_distribution_support.py -v
      - name: Resolve desktop and pinned compositor against current repositories
        run: python tests/repository_matrix.py --distro '${{ matrix.distro }}' --output repository-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repository-${{ matrix.distro }}
          path: repository-report.json
